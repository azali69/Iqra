name: Build Android APK

on:
  push:
    branches: [main]
    paths: ['index.html', 'audio/**', 'jszip.min.js', 'android/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Put the web app and recordings inside the APK
        run: |
          mkdir -p android/app/src/main/assets
          cp index.html jszip.min.js android/app/src/main/assets/
          cp -r audio android/app/src/main/assets/audio

      - name: Build
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: |
          set +e
          gradle -p android assembleRelease --no-daemon --stacktrace > build.log 2>&1
          code=$?
          tail -n 60 build.log
          if [ $code -ne 0 ]; then
            msg=$(grep -E -A6 "What went wrong|error:|ERROR|Exception" build.log | head -n 40 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=Gradle build failed::${msg}"
            exit $code
          fi

      - name: Name the APK
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk "out/Iqra-Reading-Steps-v1.0-build${{ github.run_number }}.apk"
          sha256sum out/*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: out/*.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0-build${{ github.run_number }}
          name: Iqra' Reading Steps v1.0 (build ${{ github.run_number }})
          make_latest: true
          files: out/*.apk
          body: |
            Android app for Iqra' Reading Steps, with the teacher's recordings built in (works offline).

            Install: download the .apk on your phone and open it. Android will ask you to allow installs from this source the first time.
            Updates install over the previous version, keeping your progress.
