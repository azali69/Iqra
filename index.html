<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#1E6B57"><style>:root{padding-block:env(safe-area-inset-top,0px) env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style></head><body>
<title>Iqra' Reading Steps</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Naskh+Arabic:wght@400;600&family=Newsreader:opsz,wght@6..72,500;6..72,600&family=Public+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: one calm reading column; level list → lesson board of large Arabic tiles → practice. */
:root{
  --paper:#F3F5F1; --surface:#FFFFFF; --ink:#1C2826; --muted:#5B6B67; --line:#D9E0DB;
  --accent:#1E6B57; --accent-soft:#E2EFE9; --gold:#A8741A; --gold-soft:#F6ECD9; --warn:#9A3B26;
  --f-display:"Newsreader", Georgia, serif;
  --f-body:"Public Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-ar:"Noto Naskh Arabic", "Scheherazade New", "Traditional Arabic", serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#121918; --surface:#1A2422; --ink:#E6ECE9; --muted:#9AABA6; --line:#2C3A37;
  --accent:#5FBF9F; --accent-soft:#1D3530; --gold:#E0B060; --gold-soft:#33291A; --warn:#E58A70; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#121918; --surface:#1A2422; --ink:#E6ECE9; --muted:#9AABA6; --line:#2C3A37;
  --accent:#5FBF9F; --accent-soft:#1D3530; --gold:#E0B060; --gold-soft:#33291A; --warn:#E58A70; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font:16px/1.55 var(--f-body);padding-inline:16px;padding-block:20px 48px}
.wrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
h1,h2,h3{font-family:var(--f-display);font-weight:600;line-height:1.15;margin:0;text-wrap:balance}
h1{font-size:2rem}h2{font-size:1.5rem}h3{font-size:1.1rem}
p{margin:0}
.muted{color:var(--muted)}
.eyebrow{font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
.ar{font-family:var(--f-ar);direction:rtl;unicode-bidi:isolate}
button{font:inherit;cursor:pointer}
button:focus-visible,.tile:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:9px 16px;font-weight:500}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--paper)}
.btn.ghost{background:transparent}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.hero-ar{font-size:3rem;color:var(--accent);line-height:1}
/* level list */
.levels{display:flex;flex-direction:column;gap:10px}
.lvl{display:grid;grid-template-columns:56px 1fr auto;gap:14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;text-align:left;color:var(--ink)}
.lvl:hover{border-color:var(--accent)}
.lvl .num{font-family:var(--f-display);font-size:1.6rem;color:var(--accent);text-align:center}
.lvl .sample{font-size:1.9rem;color:var(--ink)}
.lvl .meta{min-width:0}
.bar{height:5px;border-radius:5px;background:var(--line);overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--accent)}
.done-chip{font-size:.75rem;background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:2px 9px;font-weight:600}
/* lesson */
.rule{background:var(--gold-soft);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.rule h3{color:var(--gold)}
.rule-body{display:flex;gap:16px;align-items:center}
.rule-body .txt{display:flex;flex-direction:column;gap:6px;min-width:0}
.mark{font-size:4.2rem;line-height:1.25;color:var(--gold);background:var(--surface);border-radius:12px;padding:0 14px;flex:none}
@media (max-width:480px){.rule-body{flex-direction:column;align-items:flex-start}}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:10px;direction:rtl}
.grid.words{grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}
.tile{direction:ltr;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 6px 8px;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--ink);min-width:0}
.tile .ar{font-size:2.6rem;line-height:1.5}
.grid.words .tile .ar{font-size:2.2rem}
.tile .tr{font-size:.85rem;color:var(--muted);min-height:1.2em}
.tile .en{font-size:.78rem;color:var(--accent);text-align:center;line-height:1.25}
.tile .code{font-size:.66rem;color:var(--muted);opacity:.7;font-variant-numeric:tabular-nums}
.tile.sel{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent) inset}
.tile.has-audio .code::after{content:" ♪";color:var(--accent)}
.hide-tr .tile .tr{visibility:hidden}
.detail .row{grid-column:1/-1}
.spk::before{content:"";display:inline-block;width:0;height:0;border-style:solid;border-width:.38em .5em .38em 0;border-color:transparent currentColor transparent transparent;margin-right:.5em;transform:scaleX(-1);vertical-align:.02em}
.detail{position:sticky;bottom:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 16px;display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center;box-shadow:0 6px 24px rgb(0 0 0 / .08)}
.detail .ar{font-size:2.6rem;line-height:1.3;color:var(--accent)}
.detail .info{min-width:0}
.section-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.switch{display:flex;align-items:center;gap:8px;font-size:.9rem;color:var(--muted)}
/* practice */
.q{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:22px 16px;display:flex;flex-direction:column;align-items:center;gap:16px;text-align:center}
.q .big{font-size:4rem;line-height:1.4}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;width:100%}
.opt{border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:12px;padding:12px;font-size:1.05rem}
.opt.ar-opt{font-family:var(--f-ar);font-size:2rem;line-height:1.3}
.opt.right{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600}
.opt.wrong{border-color:var(--warn);color:var(--warn)}
.score{font-family:var(--f-display);font-size:3rem;color:var(--accent)}
/* recordings */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px}
.codes{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.8rem;background:var(--paper);border-radius:10px;padding:10px;max-height:220px;overflow:auto;white-space:pre-wrap;word-break:break-word}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:9px 16px;border-radius:999px;font-size:.9rem;max-width:calc(100% - 32px)}
.note{font-size:.85rem;color:var(--muted)}
.refs{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.refbox{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:6px;min-width:0}
.refl{font-size:2rem;line-height:1.7;margin:0;word-spacing:.35em;color:var(--accent)}
.cue{font-weight:600;color:var(--muted);min-height:1.5em}
.cue.turn{color:var(--accent);font-size:1.15rem}
.vres{font-size:.92rem;color:var(--muted)}.vres:empty{display:none}
.vres.ok{color:var(--accent);font-weight:600}.vres.close{color:var(--gold);font-weight:600}.vres.no{color:var(--warn)}
.vres .ar{font-size:1.4rem;font-weight:400}
.rec::before{content:"";display:inline-block;width:.6em;height:.6em;border-radius:50%;background:currentColor;margin-right:.45em;vertical-align:.05em}
.btn.live{background:var(--warn);border-color:var(--warn);color:var(--paper)}
.teacher-bar{background:var(--gold-soft);color:var(--gold);border-radius:10px;padding:10px 12px;font-size:.9rem;font-weight:600}
.teacher-bar input{width:1.15em;height:1.15em;accent-color:var(--gold)}
.mic::before{content:"";display:inline-block;width:.6em;height:.9em;border:2px solid currentColor;border-radius:.4em;margin-right:.45em;vertical-align:-.1em}
@media (max-width:480px){h1{font-size:1.6rem}.lvl{grid-template-columns:40px 1fr}.lvl .sample{display:none}.detail{grid-template-columns:auto 1fr}.detail .btn{grid-column:1/-1}}
@media (prefers-reduced-motion:no-preference){.tile,.opt,.lvl{transition:border-color .15s,background .15s}}
</style>

<div class="wrap" id="app"></div>
<div class="toast" id="toast" hidden></div>

<script>
/* ---------- Content (original lessons following the standard beginner progression) ---------- */
const F='َ',K='ِ',D='ُ',S='ْ',SH='ّ';
const LET=[['ب','b','Ba'],['ت','t','Ta'],['ث','th','Tha'],['ج','j','Jim'],['ح','ḥ','Ḥa'],['خ','kh','Kha'],['د','d','Dal'],['ذ','dh','Dhal'],['ر','r','Ra'],['ز','z','Zay'],['س','s','Sin'],['ش','sh','Shin'],['ص','ṣ','Ṣad'],['ض','ḍ','Ḍad'],['ط','ṭ','Ṭa'],['ظ','ẓ','Ẓa'],['ع','ʿ','ʿAyn'],['غ','gh','Ghayn'],['ف','f','Fa'],['ق','q','Qaf'],['ك','k','Kaf'],['ل','l','Lam'],['م','m','Mim'],['ن','n','Nun'],['و','w','Waw'],['ه','h','Ha'],['ي','y','Ya']];
const AR_NAMES=['ألف','باء','تاء','ثاء','جيم','حاء','خاء','دال','ذال','راء','زاي','سين','شين','صاد','ضاد','طاء','ظاء','عين','غين','فاء','قاف','كاف','لام','ميم','نون','واو','هاء','ياء'];
const HEAVY=new Set(['خ','ص','ض','ط','ظ','غ','ق']);
const TIP={'ا':'Alif has no sound of its own. It carries a vowel (with hamzah) or lengthens the “a” before it.','ث':'Tongue tip between the teeth, as in “think”.','ح':'From the middle of the throat; a breathy h without scraping.','خ':'Back of the tongue, raspy, as in Scottish “loch”. Heavy.','ذ':'Tongue tip between the teeth, as in “this”.','ر':'Tongue tip taps once. Heavy with fathah and dammah, light with kasrah.','ص':'A heavy s with a full mouth.','ض':'Heavy. The side of the tongue presses the upper back teeth.','ط':'A heavy t with a full mouth.','ظ':'Heavy, tongue between the teeth.','ع':'Squeezed from the middle of the throat.','غ':'Like light gargling. Heavy.','ق':'Back of the tongue against the soft palate. Heavy.','ه':'A light breath from the deepest part of the throat.','أ':'A short catch in the throat (glottal stop), then the vowel.','إ':'A short catch in the throat (glottal stop), then the vowel.'};
function drill(mark, vowel, alifForm){
  const out=[{ar:alifForm+mark, tr:vowel, name:'Alif (hamzah)', syl:true}];
  LET.forEach(([c,t,n])=>out.push({ar:c+mark, tr:t+vowel, name:n, syl:true}));
  return out;
}
const W=(ar,tr,en)=>({ar,tr,en});
const BARE=[{ar:'ا',tr:'Alif',bare:true,say:[AR_NAMES[0]]}].concat(LET.map(([c,t,n],i)=>({ar:c,tr:n,bare:true,say:[AR_NAMES[i+1]]})));
const LEVELS=[
 {t:'The 28 letters and their names', s:'ا ب ت', mark:'ب', rule:['Start by knowing each letter by its shape and its name, with no vowel marks yet. Arabic is read from right to left.','Say the name of each letter aloud: Alif, Ba, Ta, Tha. Alif has no sound of its own; the other letters get their sound from the vowel marks in the next steps.'], groups:[{h:'All 28 letters', items:BARE}]},
 {t:'The letters with fathah', s:'بَ', mark:'بَ', rule:['Each letter carries a small stroke above it, the fathah. It gives the short “a” sound.','Read every letter as a whole syllable: ba, ta, tha. The heavy letters (خ ص ض ط ظ غ ق) are said with a full, rounded mouth, so they sound closer to “o”.'], groups:[{h:'All 28 letters', items:drill(F,'a','أ')}]},
 {t:'Joined letters', s:'كَتَبَ', rule:['Letters join together and change shape: most take a short form at the start or middle of a word.','Six letters never join to the letter after them: ا د ذ ر ز و. Read each syllable evenly, with no lengthening.'], groups:[{h:'Words with fathah only', words:true, items:[W('كَتَبَ','kataba','he wrote'),W('ذَهَبَ','dhahaba','he went'),W('جَلَسَ','jalasa','he sat'),W('فَتَحَ','fataḥa','he opened'),W('خَلَقَ','khalaqa','he created'),W('نَصَرَ','naṣara','he helped'),W('صَبَرَ','ṣabara','he was patient'),W('شَكَرَ','shakara','he thanked'),W('غَفَرَ','ghafara','he forgave'),W('ظَلَمَ','ẓalama','he wronged'),W('طَلَبَ','ṭalaba','he sought'),W('دَخَلَ','dakhala','he entered'),W('ذَكَرَ','dhakara','he remembered'),W('رَجَعَ','rajaʿa','he returned'),W('وَعَدَ','waʿada','he promised'),W('زَرَعَ','zaraʿa','he planted'),W('أَمَرَ','amara','he commanded'),W('سَأَلَ','saʾala','he asked'),W('قَرَأَ','qaraʾa','he read'),W('ثَبَتَ','thabata','he stood firm')]}]},
 {t:'Long “ā” with alif', s:'قَالَ', mark:'بَا', rule:['A letter with fathah followed by a plain alif (ا) is stretched to two counts: bā, not ba.','Count evenly: about the time of two short vowels. Do not stretch three or four counts here.'], groups:[{h:'Words with the long ā', words:true, items:[W('قَالَ','qāla','he said'),W('كَانَ','kāna','he was'),W('جَاءَ','jāʾa','he came'),W('نَامَ','nāma','he slept'),W('صَامَ','ṣāma','he fasted'),W('زَادَ','zāda','he increased'),W('خَافَ','khāfa','he feared'),W('قَامَ','qāma','he stood')]}]},
 {t:'Kasrah, dammah and long ī, ū', s:'بِ بُ', mark:'بِ بُ', rule:['Kasrah is a stroke below the letter: short “i” (bi). Dammah is a small waw above: short “u” (bu).','Kasrah followed by ya (ي) gives a long ī. Dammah followed by waw (و) gives a long ū. Both are two counts.'], groups:[{h:'Letters with kasrah', items:drill(K,'i','إ')},{h:'Letters with dammah', items:drill(D,'u','أ')},{h:'Words', words:true, items:[W('عَلِمَ','ʿalima','he knew'),W('سَمِعَ','samiʿa','he heard'),W('شَرِبَ','shariba','he drank'),W('كُتِبَ','kutiba','it was written'),W('خُلِقَ','khuliqa','he was created'),W('رُسُلُ','rusulu','messengers'),W('كُتُبُ','kutubu','books'),W('فِي','fī','in'),W('قِيلَ','qīla','it was said'),W('نُورُ','nūru','light'),W('يَقُولُ','yaqūlu','he says'),W('يَكُونُ','yakūnu','it will be')]}]},
 {t:'Tanwin (double vowels)', s:'بٌ بٍ بًا', mark:'بٌ بٍ بًا', rule:['A doubled vowel adds an “n” sound at the end of a word: -an, -in, -un.','Fathatan usually sits on a letter followed by an alif (ـًا). Read it “-an” when continuing; when you stop on it, read a long “ā” and drop the n.'], groups:[{h:'Words', words:true, items:[W('كِتَابٌ','kitābun','a book'),W('رَجُلٌ','rajulun','a man'),W('قَلَمٍ','qalamin','a pen'),W('بَابًا','bāban','a door'),W('عَلِيمٌ','ʿalīmun','all-knowing'),W('حَكِيمًا','ḥakīman','all-wise'),W('غَفُورٌ','ghafūrun','oft-forgiving'),W('رَحِيمٌ','raḥīmun','merciful')]}]},
 {t:'Sukun (no vowel)', s:'قُلْ', mark:'بْ', rule:['The sukun is a small round circle (like an “o”) on top of a letter. It means the letter has no vowel: it closes the syllable before it, as in qul and min.','The letters ق ط ب ج د with sukun are read with a slight bounce (qalqalah), as in qad.'], groups:[{h:'Words', words:true, items:[W('قُلْ','qul','say'),W('لَمْ','lam','did not'),W('مِنْ','min','from'),W('عَنْ','ʿan','about'),W('هَلْ','hal','is it? (question)'),W('بَلْ','bal','rather'),W('قَدْ','qad','indeed'),W('يَعْلَمُ','yaʿlamu','he knows'),W('أَنْتُمْ','antum','you (plural)')]}]},
 {t:'Shaddah (doubled letter)', s:'رَبِّ', mark:'بَّ', rule:['The shaddah (ّ) doubles a letter: hold it once to close the syllable, then read it again with its vowel: rab-bi.','Nun and mim with shaddah (نّ مّ) carry ghunnah, a nasal hum held for two counts.'], groups:[{h:'Words', words:true, items:[W('رَبِّ','rabbi','my Lord'),W('إِنَّ','inna','indeed'),W('ثُمَّ','thumma','then'),W('حَقٌّ','ḥaqqun','truth'),W('كُلُّ','kullu','every'),W('عَلَّمَ','ʿallama','he taught'),W('يُسَبِّحُ','yusabbiḥu','glorifies'),W('مُحَمَّدٌ','muḥammadun','Muhammad')]}]},
 {t:'“Al-” : moon and sun letters', s:'الشَّمْسُ', ref:[['Moon letters: the lam is read','الْحُرُوفُ الْقَمَرِيَّةُ','ا ب ج ح خ ع غ ف ق ك م ه و ي'],['Sun letters: the lam is silent','الْحُرُوفُ الشَّمْسِيَّةُ','ت ث د ذ ر ز س ش ص ض ط ظ ل ن']], rule:['Moon letters: the lam of “al” is pronounced and carries a sukun (الْقَمَرُ, al-qamaru).','Sun letters: the lam is silent and the next letter doubles with shaddah (الشَّمْسُ, ash-shamsu). The opening alif is read only when you start from that word.'], groups:[{h:'Moon letters (lam is read)', words:true, items:[W('الْقَمَرُ','al-qamaru','the moon'),W('الْكِتَابُ','al-kitābu','the book'),W('الْحَمْدُ','al-ḥamdu','the praise'),W('الْأَرْضُ','al-arḍu','the earth')]},{h:'Sun letters (lam is silent)', words:true, items:[W('الشَّمْسُ','ash-shamsu','the sun'),W('النَّاسُ','an-nāsu','mankind'),W('الرَّحِيمِ','ar-raḥīmi','the Most Merciful'),W('السَّمَاءُ','as-samāʾu','the sky'),W('الدِّينِ','ad-dīni','the Judgement')]}]}
];
// Each step keeps a fixed id so recording file names (id-NN) never change when steps are added or reordered.
LEVELS.forEach((L,i)=>L.id=i+1);
{ // extra practice steps built from the existing syllable recordings
  const pad=n=>String(n).padStart(2,'0');
  const LETTERS=[['ا','','Alif']].concat(LET.map(([c,t,n])=>[c,t,n]));
  const syl=(i,v)=>{const c=LETTERS[i][0],t=LETTERS[i][1];
    if(v==='a')return {ar:(i?c:'أ')+F,tr:t+'a',code:'2-'+pad(i+1)};
    if(v==='i')return {ar:(i?c:'إ')+K,tr:t+'i',code:'5-'+pad(i+1)};
    return {ar:(i?c:'أ')+D,tr:t+'u',code:'5-'+pad(i+29)}};
  const chain=parts=>({ar:parts.map(x=>x.ar).join(' '),tr:parts.map(x=>x.tr).join(' '),seq:parts.map(x=>x.code)});
  const same=LETTERS.map((L,i)=>chain([syl(i,'a'),syl(i,'i'),syl(i,'u')]));
  const rev=LETTERS.map((L,i)=>chain([syl(i,'u'),syl(i,'i'),syl(i,'a')]));
  const V=['a','i','u'];const mixed=[];
  for(let r=0;r<24;r++){const parts=[];for(let k=0;k<4;k++){const i=(r*5+k*11+3)%28;parts.push(syl(i,V[(r+k*2)%3]))}mixed.push(chain(parts))}
  const MIX={id:10,t:'Mixed harakat practice',s:'بَ بِ بُ',mark:'بَ بِ بُ',rule:['Read each row from right to left, one syllable at a time: fathah “a”, kasrah “i”, dammah “u”.','Look at the mark on every letter before you say it. Keep every syllable short and even. The teacher’s voice reads the row syllable by syllable.'],
    groups:[{h:'One letter, three vowels',words:true,items:same},{h:'The same, in reverse',words:true,items:rev},{h:'Mixed rows',words:true,items:mixed}]};
  const tw=(mark,end,alif)=>LETTERS.map((L,i)=>({ar:(i?L[0]:alif)+mark,tr:L[1]+end,name:L[2]}));
  const TAN={id:11,t:'Tanwin on each letter',s:'بً بٍ بٌ',mark:'بً بٍ بٌ',rule:['Two fathah marks (ً) read “an”, two kasrah marks (ٍ) read “in”, two dammah marks (ٌ) read “un”.','In these drills the tanwin is written on the letter alone. In real words, fathatan is usually followed by an alif (ـًا), as you will see in the next step.'],
    groups:[{h:'Fathatan (an)',items:tw('ً','an','أ')},{h:'Kasratan (in)',items:tw('ٍ','in','إ')},{h:'Dammatan (un)',items:tw('ٌ','un','أ')}]};
  // combined practice: harakat + tanwin, separate and joined (voice = the teacher's own syllable recordings in sequence)
  const tan=(i,v)=>{const c=LETTERS[i][0],t=LETTERS[i][1];
    if(v==='a')return {ar:(i?c:'أ')+'ً',tr:t+'an',code:'11-'+pad(i+1)};
    if(v==='i')return {ar:(i?c:'إ')+'ٍ',tr:t+'in',code:'11-'+pad(i+29)};
    return {ar:(i?c:'أ')+'ٌ',tr:t+'un',code:'11-'+pad(i+57)}};

let actx=null;const bufCache={};let joinSrcs=[];
async function clipBuf(c){if(bufCache[c])return bufCache[c];actx=actx||new (window.AudioContext||window.webkitAudioContext)();
  const buf=await actx.decodeAudioData(await (await fetch(audio[c])).arrayBuffer());
  // find where the voice starts and ends (ignore quiet lead-in and tail)
  const d=buf.getChannelData(0);let pk=0;for(let i=0;i<d.length;i++)pk=Math.max(pk,Math.abs(d[i]));
  const w=Math.round(buf.sampleRate*0.01),th=pk*0.06;let a=0,b=d.length-1;
  const lvl=i=>{let m=0;for(let j=i;j<Math.min(d.length,i+w);j++)m=Math.max(m,Math.abs(d[j]));return m};
  while(a<d.length&&lvl(a)<th)a+=w;while(b>a&&lvl(Math.max(0,b-w))<th)b-=w;

async function playJoined(list,tok,onDone){
  try{const cl=await Promise.all(list.map(clipBuf));if(tok!==playToken)return;await actx.resume();
    const X=0.035;let t=actx.currentTime+0.05;joinSrcs=[];
    cl.forEach((c,k)=>{const src=actx.createBufferSource();src.buffer=c.buf;const g=actx.createGain();src.connect(g).connect(actx.destination);
      const dur=c.end-c.start;g.gain.setValueAtTime(k?0:1,t);if(k)g.gain.linearRampToValueAtTime(1,t+X);
      if(k<cl.length-1){g.gain.setValueAtTime(1,t+dur-X);g.gain.linearRampToValueAtTime(0,t+dur)}

    const ms=(t-actx.currentTime)*1000+60;setTimeout(()=>{if(tok===playToken&&onDone)onDone()},ms)}
  catch(e){if(tok===playToken&&onDone)onDone()}}
function play(code,onDone){
  const it=BY_CODE[code];const list=it&&it.seq&&!audio[code]?it.seq:[code];
  if(!list.every(c=>audio[c]))return false;
  if(list.length>1&&it.joined){const tok=++playToken;player.pause();chainEls.forEach(a=>a.pause());playJoined(list,tok,onDone);return true}
  const tok=++playToken;let k=0;chainEls.forEach(a=>a.pause());joinSrcs.forEach(s=>{try{s.stop()}catch(e){}});joinSrcs=[];
  if(list.length===1){player.onended=()=>{if(tok!==playToken)return;player.onended=null;if(onDone)onDone()};player.pause();player.src=audio[list[0]];player.play().catch(()=>{});return true}
  // a row of syllables: load every clip first so they follow each other with only a short breath between them
  player.pause();const els=list.map(c=>{const a=new Audio(audio[c]);a.preload='auto';return a});chainEls=els;
  const next=()=>{if(tok!==playToken)return;if(k>=els.length){if(onDone)onDone();return}
    const a=els[k++];a.onended=()=>{if(tok!==playToken)return;setTimeout(next,SYL_GAP)};a.play().catch(()=>{})};

async function recordToggle(btn,out,onDone){

  const mr=new MediaRecorder(stream,mime?{mimeType:mime}:undefined);const chunks=[];const label=btn.textContent;
  rec={mr,btn};mr.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};
  mr.onstop=()=>{clearTimeout(rec.t);stream.getTracks().forEach(t=>t.stop());btn.textContent=label;btn.classList.remove('live');rec=null;const blob=new Blob(chunks,{type:(mr.mimeType||mime||'audio/webm').split(';')[0]});if(blob.size>500)onDone(blob);else{out.className='vres no';out.textContent='Nothing was recorded. Try again.'}};
  player.pause();mr.start();btn.textContent='Stop';btn.classList.add('live');out.className='vres';out.textContent='Recording… tap Stop when finished.';
  rec.t=setTimeout(()=>{if(mr.state==='recording')mr.stop()},REC_MAX);
}

  <div id="groups" class="${showTr?'':'hide-tr'}" style="display:flex;flex-direction:column;gap:18px">
  ${L.groups.map(g=>`<section style="display:flex;flex-direction:column;gap:10px"><div class="section-h"><h3>${esc(g.h)}</h3><span class="note">Read right to left</span></div>
    <div class="grid ${g.words?'words':''}">${g.items.map(it=>`<button class="tile ${hasVoice(it.code)?'has-audio':''}" data-c="${it.code}" aria-label="${esc(it.tr)}"><span class="ar">${it.ar}</span><span class="tr">${esc(it.tr)}</span>${it.en?`<span class="en">${esc(it.en)}</span>`:''}<span class="code">${it.code}</span></button>`).join('')}</div></section>`).join('')}
  </div>
  <div class="row"><button class="btn primary" id="prac">Practice this step</button><button class="btn spk" id="voice">Listen and repeat</button><button class="btn" id="mark">${done[LEVELS[li].id-1]?'Marked as done':'Mark step as done'}</button>${li<LEVELS.length-1?`<button class="btn ghost" id="next">Next step →</button>`:''}</div>
  <div class="detail" id="detail" hidden></div>`;
  document.getElementById('back').onclick=home;
  document.getElementById('trT').onchange=e=>{showTr=e.target.checked;store.set('showTr',showTr);document.getElementById('groups').classList.toggle('hide-tr',!showTr)};
  document.getElementById('prac').onclick=()=>practice(li);
  document.getElementById('voice').onclick=()=>listenRepeat(li);
  document.getElementById('tmodeL').onchange=e=>{teacher=e.target.checked;store.set('teacher',teacher);const y=scrollY;const sel=app.querySelector('.tile.sel');const c=sel&&sel.dataset.c;lesson(li);scrollTo(0,y);if(c){const t=app.querySelector(`.tile[data-c="${c}"]`);if(t)t.click()}};
  document.getElementById('mark').onclick=e=>{const d=LEVELS[li].id-1;done[d]=!done[d];store.set('done',done);e.target.textContent=done[d]?'Marked as done':'Mark step as done'};
  const nx=document.getElementById('next');if(nx)nx.onclick=()=>lesson(li+1);
  let warned=false;
  app.querySelectorAll('.tile').forEach(b=>b.onclick=()=>{
    app.querySelectorAll('.tile.sel').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');
    const it=BY_CODE[b.dataset.c];seen[it.code]=true;store.set('seen',seen);
    const ch=it.en?firstChar(it.ar):it.ar.charAt(0);
    const tip=it.en?'':(TIP[ch]||(HEAVY.has(ch)?'Heavy letter: full, rounded mouth.':''));
    renderDetail(it,b,tip);
    if(!play(it.code)&&!warned&&!Object.keys(audio).length&&!teacher){warned=true;toast('No recordings yet. Ask the teacher to record, or add files under Manage recordings.')}
  });
  scrollTo(0,0);
}

function renderDetail(it,tile,tip){
  const d=document.getElementById('detail');d.hidden=false;
  const has=hasVoice(it.code);const hasTry=!!tries[it.code];
  const btns=teacher&&(!it.seq||it.joined)
    ?`${has?'<button class="btn" id="again">Play</button>':''}<button class="btn primary rec" id="rec">${has?'Re-record':'Record'}</button>${local.has(it.code)?'<button class="btn ghost" id="del">'+(BUNDLED.has(it.code)?'Use app recording':'Delete')+'</button>':''}`
    :`<button class="btn primary spk" id="tv">Teacher’s voice</button><button class="btn rec" id="mytry">Record my try</button>${hasTry?'<button class="btn" id="cmp">'+(has?'Compare':'Play my try')+'</button>':''}`;

  d.innerHTML=`<span class="ar">${it.ar}</span><span class="info"><strong>${esc(it.tr)}</strong>${it.name?` <span class="muted">· ${esc(it.name)}</span>`:''}${it.en?`<br><span class="muted">${esc(it.en)}</span>`:''}${tip?`<br><span class="note">${esc(tip)}</span>`:''}</span><span class="row">${btns}</span><p class="vres" id="vres" style="grid-column:1/-1" aria-live="polite"></p>`;
  const out=document.getElementById('vres');const $=id=>document.getElementById(id);
  if($('again'))$('again').onclick=()=>play(it.code);
  if($('tv'))$('tv').onclick=()=>{if(!play(it.code)){out.className='vres';out.textContent='No teacher recording for this tile yet. Turn on Teacher recording mode at the top of the step to record it.'}};
  if($('cmp'))$('cmp').onclick=()=>compare(it.code);
  if($('rec'))$('rec').onclick=()=>recordToggle($('rec'),out,async blob=>{try{await saveClip(it.code,blob);tile.classList.add('has-audio');renderDetail(it,tile,tip);const o=document.getElementById('vres');o.className='vres ok';o.textContent='Saved as the reference for '+it.code+'. Tap Play to check it.';play(it.code)}catch(e){out.className='vres no';out.textContent='Could not save the recording on this device.'}});
  if($('mytry'))$('mytry').onclick=()=>recordToggle($('mytry'),out,blob=>{if(tries[it.code])URL.revokeObjectURL(tries[it.code]);tries[it.code]=URL.createObjectURL(blob);renderDetail(it,tile,tip);const o=document.getElementById('vres');o.className='vres';o.textContent=audio[it.code]?'Tap Compare to hear the teacher, then yourself. Keep practising; every try helps.':'Recorded. Tap Play my try to listen.'});
  if($('del')){let armed=false;const lab=$('del').textContent;$('del').onclick=async()=>{if(!armed){armed=true;$('del').textContent='Tap again to confirm';setTimeout(()=>{armed=false;const x=$('del');if(x)x.textContent=lab},3000);return}await deleteClip(it.code);if(!audio[it.code])tile.classList.remove('has-audio');renderDetail(it,tile,tip);toast(audio[it.code]?'Now using the app’s recording':'Recording deleted')}}
}

function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function practice(li){
  const pool=LEVELS[li].all;const qs=shuffle(pool).slice(0,10);let k=0,score=0;
  function ask(){
    if(k>=qs.length)return finish();
    const it=qs[k];const listen=hasVoice(it.code)&&Math.random()<.5;
    const others=shuffle(pool.filter(p=>p.tr!==it.tr&&p.ar!==it.ar)).slice(0,3);
    const opts=shuffle([it,...others]);
    app.innerHTML=`<div class="row"><button class="btn ghost" id="quit">← Back to step ${li+1}</button></div>
    <div class="top"><h2>Practice</h2><span class="note">Question ${k+1} of ${qs.length} · ${score} correct</span></div>
    <div class="q">${listen?`<p class="muted">Listen, then choose the matching text.</p><button class="btn primary" id="hear">Play sound</button>`:`<p class="muted">How is this read?</p><div class="ar big">${it.ar}</div>`}
    <div class="opts">${opts.map(o=>`<button class="opt ${listen?'ar-opt':''}" data-c="${o.code}">${listen?o.ar:esc(o.tr)}</button>`).join('')}</div>
    <p class="note" id="fb" aria-live="polite">&nbsp;</p></div>`;
    document.getElementById('quit').onclick=()=>lesson(li);
    if(listen){document.getElementById('hear').onclick=()=>play(it.code)}
    let answered=false;
    app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
      if(answered)return;answered=true;const ok=b.dataset.c===it.code;if(ok)score++;
      app.querySelectorAll('.opt').forEach(x=>{if(x.dataset.c===it.code)x.classList.add('right')});if(!ok)b.classList.add('wrong');
      seen[it.code]=true;store.set('seen',seen);
      document.getElementById('fb').textContent=(ok?'Correct. ':'Not quite. ')+`${it.ar} is read “${it.tr}”${it.en?` (${it.en})`:''}.`;
      if(!listen)play(it.code);
      setTimeout(()=>{k++;ask()},ok?1100:2300);
    });
  }
  function finish(){
    {const d=LEVELS[li].id-1;if(best[d]==null||score>best[d]){best[d]=score;store.set('best',best)}}
    app.innerHTML=`<div class="q"><p class="eyebrow">Step ${li+1} practice</p><div class="score">${score}/${qs.length}</div>
    <p class="muted">${score>=9?'Ready for the next step.':score>=7?'Good. Review the tiles you missed, then try again.':'Spend more time on the tiles, ideally with a teacher listening.'}</p>
    <div class="row" style="justify-content:center"><button class="btn primary" id="again">Try again</button><button class="btn" id="bk">Back to step</button>${li<LEVELS.length-1?'<button class="btn ghost" id="nx">Next step →</button>':''}</div></div>`;
    document.getElementById('again').onclick=()=>practice(li);
    document.getElementById('bk').onclick=()=>lesson(li);
    const nx=document.getElementById('nx');if(nx)nx.onclick=()=>lesson(li+1);
  }
  ask();
}

function listenRepeat(li){
  const items=LEVELS[li].all.filter(i=>hasVoice(i.code));let k=0,paused=false,timer=null;
  if(!items.length){toast('This step has no teacher recordings yet');return}
  const stop=()=>{clearTimeout(timer);stopAudio()};
  function show(){
    stop();if(k>=items.length){app.innerHTML=`<div class="q"><p class="eyebrow">Step ${li+1}</p><h2>Well done!</h2><p class="muted">You listened and repeated all ${items.length} items. Go through it again any time; repetition is how reading becomes easy.</p><div class="row" style="justify-content:center"><button class="btn primary" id="again">Start again</button><button class="btn" id="bk">Back to step</button></div></div>`;document.getElementById('again').onclick=()=>listenRepeat(li);document.getElementById('bk').onclick=()=>lesson(li);return}
    const it=items[k];seen[it.code]=true;store.set('seen',seen);
    app.innerHTML=`<div class="row"><button class="btn ghost" id="quit">← Back to step ${li+1}</button></div>
    <div class="top"><h2>Listen and repeat</h2><span class="note">${k+1} of ${items.length}</span></div>
    <div class="bar" style="margin-top:0"><i style="width:${Math.round(100*k/items.length)}%"></i></div>
    <div class="q"><div class="ar big">${it.ar}</div>
    <p><strong>${esc(it.tr)}</strong>${it.en?` <span class="muted">· ${esc(it.en)}</span>`:''}</p>
    <p class="cue" id="cue" aria-live="polite">Listen…</p>
    <div class="row" style="justify-content:center"><button class="btn" id="prev">← Back</button><button class="btn spk" id="rep">Hear again</button><button class="btn" id="pz">${paused?'Resume':'Pause'}</button><button class="btn primary" id="nx">Next →</button></div></div>`;
    const $=id=>document.getElementById(id);
    $('quit').onclick=()=>{stop();lesson(li)};
    $('prev').onclick=()=>{k=Math.max(0,k-1);show()};
    $('nx').onclick=()=>{k++;show()};
    $('rep').onclick=()=>run(true);
    $('pz').onclick=()=>{paused=!paused;$('pz').textContent=paused?'Resume':'Pause';if(paused){stop();$('cue').textContent='Paused'}else run(false)};
    function run(once){
      stop();$('cue').textContent='Listen…';$('cue').className='cue';
      const t0=Date.now();
      play(it.code,()=>{const gap=Math.max(1800,(Date.now()-t0)+1200);
        $('cue').textContent='Your turn: say it aloud';$('cue').className='cue turn';
        if(!once&&!paused)timer=setTimeout(()=>{k++;show()},gap)});
    }
    if(!paused)run(false);
  }
  show();
}

function loadScript(src){return new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=rej;document.head.appendChild(s)})}
async function exportZip(){
  const clips=await allClips();if(!clips.length){toast('No recordings to download yet');return}
  try{if(!window.JSZip)await loadScript('https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js');
    const zip=new JSZip();const ext=t=>/mp4|m4a|aac/.test(t)?'m4a':/mpeg|mp3/.test(t)?'mp3':/ogg/.test(t)?'ogg':/wav/.test(t)?'wav':'webm';
    clips.forEach(([code,blob])=>zip.file(code+'.'+ext(blob.type||''),blob));
    const z=await zip.generateAsync({type:'blob'});const a=document.createElement('a');a.href=URL.createObjectURL(z);a.download='iqra-recordings.zip';document.body.appendChild(a);a.click();a.remove();
    toast(clips.length+' recordings saved to a .zip')}
  catch(e){toast('Download isn’t available here. Use the Chrome version.')}
}

function recordings(){
  const list=LEVELS.map((L,i)=>`Step ${i+1}: ${L.t}\n`+L.all.map(it=>`  ${it.code}  ${it.tr}${it.seq?'  (plays syllable recordings)':audio[it.code]?'  ✓':''}`).join('\n')).join('\n\n');
  app.innerHTML=`<div class="row"><button class="btn ghost" id="back">← All steps</button></div>
  <h2>Audio recordings</h2>
  <div class="panel"><h3>How it works</h3>
  <p>The easiest way: turn on <strong>Teacher recording mode</strong> on the home screen, open a step, tap a tile and tap Record. To use existing files instead: every tile has a code, such as <strong>2-02</strong> for “ba”. Record each item once, name the file by its code (for example <strong>2-02.mp3</strong> or <strong>5-15.m4a</strong>), then add the files here. Any common audio format works.</p>
  <p class="note">Ask a qualified teacher to record, or check every recording with one. Recordings are saved in this browser on this device only.</p>
  <div class="row"><label class="btn primary" for="pick" style="display:inline-block">Add recording files</label><input id="pick" type="file" accept="audio/*" multiple hidden><button class="btn" id="exp">Download all as .zip</button><button class="btn" id="clr">Remove all</button></div>
  <p class="note" id="res" aria-live="polite"></p></div>
  <div class="panel"><div class="section-h"><h3>Item codes</h3><button class="btn" id="cp">Copy list</button></div><div class="codes" id="codes">${esc(list)}</div></div>`;
  document.getElementById('back').onclick=home;
  document.getElementById('cp').onclick=()=>{navigator.clipboard.writeText(list).then(()=>toast('List copied'),()=>{const r=document.createRange();r.selectNodeContents(document.getElementById('codes'));const s=getSelection();s.removeAllRanges();s.addRange(r);toast('Selected. Copy it from here.')})};
  document.getElementById('exp').onclick=exportZip;
  let armed=false;
  document.getElementById('clr').onclick=async e=>{if(!armed){armed=true;e.target.textContent='Tap again to remove all';setTimeout(()=>{armed=false;e.target.textContent='Remove all'},3000);return}await clearClips();toast('All recordings removed');recordings()};
  document.getElementById('pick').onchange=async e=>{
    let ok=0,bad=[];
    for(const f of e.target.files){const m=f.name.replace(/\.[^.]+$/,'').match(/^(\d+)[-_ ](\d+)$/);const code=m?(+m[1])+'-'+String(+m[2]).padStart(2,'0'):null;
      if(code&&BY_CODE[code]){try{await saveClip(code,f);ok++}catch(err){bad.push(f.name)}}else bad.push(f.name)}
    recordings();document.getElementById('res').textContent=`Added ${ok} recording${ok===1?'':'s'}.`+(bad.length?` Skipped (name not a valid code): ${bad.join(', ')}`:'');
  };
  scrollTo(0,0);
}

loadClips().then(home);
</script>

</body></html>
